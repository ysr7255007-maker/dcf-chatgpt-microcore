<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对话记录 — DCF Surface</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: linear-gradient(160deg, #f6f8fa 0%, #eef1f6 100%);
      color: #24292f; line-height: 1.55; min-height: 100vh;
      display: flex; flex-direction: column;
    }

    .view-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 14px 20px; position: sticky; top: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }
    .view-title { font-size: 17px; font-weight: 700; }
    .view-actions button {
      border: 1px solid #d0d7de; background: #fff; color: #24292f;
      padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
    }
    .view-actions button:hover { background: #f3f4f6; }

    /* Selection action bar: appears once conversations are selected */
    .action-bar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 20px; position: sticky; top: 57px; z-index: 99;
      background: rgba(9, 105, 218, 0.08);
      border-bottom: 1px solid rgba(9, 105, 218, 0.15);
    }
    .action-bar .sel-count { font-size: 13px; font-weight: 600; color: #0969da; margin-right: auto; }
    .action-bar button {
      border: none; border-radius: 8px; padding: 7px 12px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      background: linear-gradient(135deg, #4064d2, #8b5cf6); color: #fff;
    }
    .action-bar button.ghost { background: #eaeef2; color: #57606a; }
    .action-bar button:hover { filter: brightness(1.06); }

    .conv-list { flex: 1; padding: 12px 20px 80px; display: grid; gap: 10px; }

    .conv-card {
      display: flex; gap: 12px; align-items: flex-start;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 12px; padding: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      cursor: pointer; transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .conv-card:hover { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.09); }
    .conv-card.selected { border-color: #0969da; box-shadow: 0 0 0 2px rgba(9,105,218,0.25); }
    .conv-check { width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; cursor: pointer; }
    .conv-body { min-width: 0; flex: 1; }
    .conv-preview { font-size: 14px; color: #24292f; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .conv-meta { margin-top: 6px; font-size: 11px; color: #8b949e; }
    .conv-expand-hint { color: #0969da; margin-left: 6px; }

    .conv-messages {
      display: none; margin-top: 10px; padding-top: 10px;
      border-top: 1px dashed rgba(0,0,0,0.12);
      max-height: 320px; overflow-y: auto;
    }
    .conv-card.expanded .conv-messages { display: block; }
    .conv-msg { margin-bottom: 10px; }
    .conv-msg-ts { font-size: 10px; color: #8b949e; font-family: ui-monospace, monospace; }
    .conv-msg-text {
      font-size: 13px; color: #24292f; white-space: pre-wrap; word-break: break-word;
      background: #f6f8fa; border-radius: 8px; padding: 8px 10px; margin-top: 2px;
    }

    .empty-state { text-align: center; color: #8b949e; padding: 60px 20px; font-size: 14px; }

    .feedback-bubble {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      background: #24292f; color: #fff; padding: 10px 18px;
      border-radius: 20px; font-size: 13px; z-index: 1000; max-width: 90%; text-align: center;
      animation: bubble-in 0.25s ease;
    }
    @keyframes bubble-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

    button:focus-visible, .conv-check:focus-visible { outline: 2px solid #0969da; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .conv-card, .feedback-bubble { transition: none; animation: none; } }
    @media (prefers-contrast: more) { .conv-card { border: 1px solid #24292f; background: #fff; } }
  </style>
</head>
<body>
  <header class="view-header">
    <h1 class="view-title">💬 对话记录</h1>
    <div class="view-actions">
      <button onclick="toggleSelectAll()" id="select-all-btn" aria-label="全选或取消全选">☑ 全选</button>
      <button onclick="loadConversations()" aria-label="刷新对话记录">↻ 刷新</button>
    </div>
  </header>

  <div class="action-bar" id="action-bar" style="display:none;">
    <span class="sel-count" id="sel-count">已选 0 条</span>
    <select id="ide-select" aria-label="选择用于生成的 IDE" title="选择 IDE" style="border:1px solid #d0d7de;border-radius:8px;padding:5px 8px;font-size:13px;"></select>
    <button onclick="generateFromSelection('task')" aria-label="用选中对话生成任务">🤖 生成任务</button>
    <button onclick="generateFromSelection('card')" aria-label="用选中对话生成卡片">🧠 生成卡片</button>
    <button onclick="generateFromSelection('ammo')" aria-label="用选中对话生成语言弹药">🔫 生成弹药</button>
    <button class="ghost" onclick="clearSelection()" aria-label="清除选择">清除</button>
  </div>

  <main class="conv-list" id="conv-list" role="list" aria-live="polite">
    <div class="empty-state">正在加载对话记录…</div>
  </main>

  <script src="../companion-client.js"></script>
  <script src="../voice-command-bar.js"></script>
  <script>
  (function (global) {
    'use strict';

    var listEl = document.getElementById('conv-list');
    var actionBar = document.getElementById('action-bar');
    var selCountEl = document.getElementById('sel-count');
    var selectAllBtn = document.getElementById('select-all-btn');
    var selected = new Set();
    var allSourceIds = [];

    function showFeedback(message) {
      var bubble = document.createElement('div');
      bubble.className = 'feedback-bubble';
      bubble.textContent = message;
      document.body.appendChild(bubble);
      setTimeout(function () { bubble.remove(); }, 2600);
    }

    function describeError(res) {
      if (!res) return 'unknown';
      var body = res.body;
      if (body && body.error && typeof body.error === 'object') return String(body.error.message || 'error');
      if (body && body.message) return String(body.message);
      if (body && body.error) return String(body.error);
      return 'HTTP ' + res.status;
    }

    function fmtTime(ts) {
      try { return new Date(ts).toLocaleString('zh-CN', { hour12: false }); } catch (_) { return ''; }
    }

    function syncSelectionUI() {
      var n = selected.size;
      actionBar.style.display = n > 0 ? 'flex' : 'none';
      selCountEl.textContent = '已选 ' + n + ' 条';
      selectAllBtn.textContent = (n > 0 && n === allSourceIds.length) ? '☐ 取消全选' : '☑ 全选';
    }

    function toggleOne(sourceId, cardEl, checkEl) {
      if (selected.has(sourceId)) { selected.delete(sourceId); cardEl.classList.remove('selected'); checkEl.checked = false; }
      else { selected.add(sourceId); cardEl.classList.add('selected'); checkEl.checked = true; }
      syncSelectionUI();
    }

    global.toggleSelectAll = function () {
      if (selected.size === allSourceIds.length) { clearSelection(); return; }
      selected = new Set(allSourceIds);
      document.querySelectorAll('.conv-card').forEach(function (c) { c.classList.add('selected'); });
      document.querySelectorAll('.conv-check').forEach(function (c) { c.checked = true; });
      syncSelectionUI();
    };

    global.clearSelection = function () {
      selected.clear();
      document.querySelectorAll('.conv-card').forEach(function (c) { c.classList.remove('selected'); });
      document.querySelectorAll('.conv-check').forEach(function (c) { c.checked = false; });
      syncSelectionUI();
    };

    var GEN = {
      task: { fn: 'requestTaskGeneration', label: '任务', emoji: '🤖', dest: '推荐将出现在任务视图' },
      card: { fn: 'requestCardGeneration', label: '卡片', emoji: '🧠', dest: '卡片将出现在卡片库' },
      ammo: { fn: 'requestAmmoExtraction', label: '弹药', emoji: '🔫', dest: '弹药将出现在弹药库' }
    };

    global.generateFromSelection = function (kind) {
      var g = GEN[kind];
      if (!g) return;
      var ids = [...selected];
      if (ids.length === 0) { showFeedback('请先勾选至少一条对话'); return; }
      global.CompanionClient[g.fn](ids, getSelectedIde()).then(function (res) {
        if (res.ok && res.body && res.body.ok !== false) {
          var data = res.body.data || {};
          var ide = data.ide_name || 'IDE';
          var how;
          if (data.autosubmit) {
            how = '已用 ' + ids.length + ' 条对话交给 ' + ide + ' 自动处理，AI 写出结果后' + g.dest;
          } else if (data.ide === 'qoder') {
            how = '已用 ' + ids.length + ' 条对话在 ' + ide + ' 新对话预填提示词，请确认发送；AI 写出结果后' + g.dest;
          } else {
            how = '已用 ' + ids.length + ' 条对话唤起 ' + ide + '，提示词已复制到剪贴板，请粘贴发送；AI 写出结果后' + g.dest;
          }
          showFeedback(g.emoji + ' ' + how);
          return;
        }
        showFeedback('生成' + g.label + '失败：' + describeError(res));
      });
    };

    function renderConversation(conv) {
      var card = document.createElement('article');
      card.className = 'conv-card';
      card.setAttribute('role', 'listitem');

      var check = document.createElement('input');
      check.type = 'checkbox';
      check.className = 'conv-check';
      check.setAttribute('aria-label', '选择此对话');
      check.addEventListener('click', function (e) { e.stopPropagation(); toggleOne(conv.source_id, card, check); });

      var body = document.createElement('div');
      body.className = 'conv-body';
      var preview = document.createElement('div');
      preview.className = 'conv-preview';
      preview.textContent = conv.preview || '（无文本预览）';
      var meta = document.createElement('div');
      meta.className = 'conv-meta';
      meta.textContent = conv.message_count + ' 条消息 · 最近 ' + fmtTime(conv.last_ts);
      var hint = document.createElement('span');
      hint.className = 'conv-expand-hint';
      hint.textContent = '▸ 点击展开';
      meta.appendChild(hint);
      body.appendChild(preview);
      body.appendChild(meta);

      // Full message list, rendered lazily on first expand.
      var msgBox = document.createElement('div');
      msgBox.className = 'conv-messages';
      msgBox.setAttribute('role', 'log');
      msgBox.setAttribute('aria-label', '对话完整消息');
      var rendered = false;
      function renderMessages() {
        if (rendered) return;
        rendered = true;
        var msgs = Array.isArray(conv.messages) ? conv.messages : [];
        if (conv.message_count > msgs.length) {
          var note = document.createElement('div');
          note.className = 'conv-msg-ts';
          note.textContent = '（共 ' + conv.message_count + ' 条，显示最近 ' + msgs.length + ' 条）';
          msgBox.appendChild(note);
        }
        msgs.forEach(function (m) {
          var wrap = document.createElement('div');
          wrap.className = 'conv-msg';
          var ts = document.createElement('div');
          ts.className = 'conv-msg-ts';
          ts.textContent = fmtTime(m.ts);
          var text = document.createElement('div');
          text.className = 'conv-msg-text';
          text.textContent = m.text;
          wrap.appendChild(ts);
          wrap.appendChild(text);
          msgBox.appendChild(wrap);
        });
        if (!msgs.length) {
          msgBox.textContent = '（无消息内容）';
        }
      }
      body.appendChild(msgBox);

      card.appendChild(check);
      card.appendChild(body);
      // Card body click toggles the full transcript; selection is the
      // checkbox's job only, so reading never fights with selecting.
      card.addEventListener('click', function () {
        var expanded = card.classList.toggle('expanded');
        if (expanded) renderMessages();
        hint.textContent = expanded ? '▾ 收起' : '▸ 点击展开';
      });
      return card;
    }

    function loadConversations() {
      clearSelection();
      global.CompanionClient.getConversations({ limit: 100 }).then(function (res) {
        listEl.innerHTML = '';
        if (!res.ok || !res.body || res.body.ok === false) {
          listEl.innerHTML = '<div class="empty-state">无法连接 Companion：' + describeError(res) + '</div>';
          return;
        }
        var conversations = (res.body.data && res.body.data.conversations) || [];
        allSourceIds = conversations.map(function (c) { return c.source_id; });
        if (!conversations.length) {
          listEl.innerHTML = '<div class="empty-state">还没有对话记录。当 DCF 采集到你与 AI 的对话后会显示在这里。</div>';
          return;
        }
        conversations.forEach(function (conv) { listEl.appendChild(renderConversation(conv)); });
        syncSelectionUI();
      });
    }

    global.loadConversations = loadConversations;

    /** IDE selector helpers. */
    function getSelectedIde() {
      var sel = document.getElementById('ide-select');
      return sel && sel.value ? sel.value : undefined;
    }
    function populateIdeSelect() {
      var sel = document.getElementById('ide-select');
      if (!sel || sel.dataset.loaded) return;
      sel.dataset.loaded = '1';
      var saved = null;
      try { saved = localStorage.getItem('dcf-ide'); } catch (_) {}
      global.CompanionClient.getIdeTargets().then(function (res) {
        var targets = (res.ok && res.body && res.body.data && res.body.data.targets) || [];
        targets.forEach(function (t) {
          var opt = document.createElement('option');
          opt.value = t.id; opt.textContent = t.name; sel.appendChild(opt);
        });
        if (saved && targets.some(function (t) { return t.id === saved; })) sel.value = saved;
        sel.addEventListener('change', function () {
          try { localStorage.setItem('dcf-ide', sel.value); } catch (_) {}
        });
      });
    }
    document.addEventListener('DOMContentLoaded', function () { populateIdeSelect(); loadConversations(); });
  })(window);
  </script>
</body>
</html>

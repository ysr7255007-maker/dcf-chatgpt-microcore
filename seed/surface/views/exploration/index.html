<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>探索图谱 — DCF Surface</title>
  <style>
    /* Exploration View (Lens 2) — Obsidian-Graph-style force layout */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Text", sans-serif;
      background: linear-gradient(160deg, #10131a, #1a2030);
      color: #e6e8ee;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Header */
    .view-header {
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      z-index: 100;
    }

    .view-title { font-size: 18px; font-weight: 700; }

    .view-nav { display: flex; gap: 8px; }

    .view-toggle-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      background: rgba(9, 105, 218, 0.25);
      color: #9ec3ff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .view-toggle-btn:hover { background: rgba(9, 105, 218, 0.45); }

    /* Graph canvas */
    #graph-container {
      position: absolute;
      inset: 52px 0 0 0;
    }

    #graph-container svg { width: 100%; height: 100%; display: block; }

    .link { stroke: rgba(158, 195, 255, 0.25); }
    .node circle {
      cursor: grab;
      stroke: rgba(255, 255, 255, 0.35);
      stroke-width: 1.5;
      transition: stroke 0.2s ease;
    }
    .node:hover circle { stroke: #fff; }
    .node.selected circle { stroke: #f9c513; stroke-width: 2.5; }
    .node text {
      fill: rgba(230, 232, 238, 0.85);
      font-size: 11px;
      pointer-events: none;
      user-select: none;
    }

    /* Node detail sidebar (plan 2.3) */
    .node-sidebar {
      position: fixed;
      top: 52px;
      right: 0;
      bottom: 0;
      width: 280px;
      max-width: 85vw;
      padding: 20px;
      background: rgba(20, 26, 40, 0.92);
      backdrop-filter: blur(20px) saturate(180%);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 200;
      overflow-y: auto;
    }

    .node-sidebar.open { transform: translateX(0); }

    .node-sidebar h3 { font-size: 17px; margin-bottom: 8px; }
    .node-meta { font-size: 12px; color: #9aa3b5; margin-bottom: 16px; line-height: 1.6; }
    .node-sidebar h4 { font-size: 13px; color: #9ec3ff; margin: 12px 0 8px; }

    .related-topics { list-style: none; }
    .related-topics li {
      padding: 8px 10px;
      margin-bottom: 6px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .related-topics li:hover { background: rgba(255, 255, 255, 0.12); }

    .sidebar-actions { display: flex; gap: 8px; margin-top: 16px; }

    .btn-primary, .btn-secondary {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary { background: rgba(9, 105, 218, 0.85); color: #fff; }
    .btn-primary:hover { background: rgba(9, 105, 218, 1); }
    .btn-secondary { background: rgba(255, 255, 255, 0.12); color: #e6e8ee; }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.22); }

    /* Status banner (offline / empty) */
    .graph-status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #9aa3b5;
      display: none;
    }
    .graph-status.visible { display: block; }
    .graph-status .icon { font-size: 42px; opacity: 0.6; margin-bottom: 10px; }

    /* Cluster legend */
    .cluster-legend {
      position: fixed;
      left: 12px;
      bottom: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(20, 26, 40, 0.85);
      backdrop-filter: blur(12px);
      font-size: 12px;
      z-index: 150;
      max-width: 220px;
    }
    .cluster-legend .item { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    .cluster-legend .swatch { width: 10px; height: 10px; border-radius: 50%; }

    @media (prefers-reduced-motion: reduce) {
      .node-sidebar { transition: none; }
    }
  </style>
  <link rel="stylesheet" href="../dark-shell.css">
</head>
<body>
  <!-- Header：标题 + 三视图标签页（全量可见 + 激活态）；收起按钮由 main.js 注入末尾 -->
  <header class="view-header">
    <h1 class="view-title">🔍 探索图谱</h1>
    <nav class="view-tabs" aria-label="视图切换">
      <button class="tab" onclick="switchView('task')">📋 任务</button>
      <button class="tab active" aria-current="page">🔍 图谱</button>
      <button class="tab" onclick="switchView('reflection')">💭 回顾</button>
    </nav>
  </header>

  <!-- Force-directed graph canvas -->
  <div id="graph-container">
    <div class="graph-status" id="graph-status">
      <div class="icon">🕸️</div>
      <div class="text" id="graph-status-text">正在加载图谱…</div>
    </div>
  </div>

  <!-- Cluster legend -->
  <div class="cluster-legend" id="cluster-legend" hidden></div>

  <!-- Node detail sidebar (slides in from the right) -->
  <aside class="node-sidebar" id="node-details-panel" aria-hidden="true">
    <h3 id="node-label">节点</h3>
    <p class="node-meta" id="node-meta"></p>

    <h4>相关话题</h4>
    <ul class="related-topics" id="related-nodes"></ul>

    <div class="sidebar-actions">
      <button class="btn-primary" onclick="focusOnNode()">聚焦此节点</button>
      <button class="btn-secondary" onclick="closeSidebar()">关闭</button>
    </div>
  </aside>

  <!-- Scripts -->
  <script src="../companion-client.js"></script>
  <script src="../voice-command-bar.js"></script>
  <script src="graph.js"></script>
</body>
</html>

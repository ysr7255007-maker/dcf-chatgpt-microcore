[workspace]
members = [
  "crates/dcf-contract",
  "crates/dcf-corpus",
  "crates/dcf-engine-api",
  "crates/dcf-engine-external",
  "crates/dcf-text-zstd",
  "crates/dcf-lab-core",
  "crates/dcf-lab-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.78"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
toml = "0.8"
zstd = "0.13"

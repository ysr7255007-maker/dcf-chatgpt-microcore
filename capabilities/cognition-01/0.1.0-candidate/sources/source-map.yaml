目标能力:
  候选编号: cognition-01
  候选名称: 稳定认知对象与不可变修订
  注意: 当前仓库尚无正式 capability-dag.yaml；本次仅以 current-state 明确指定的第一个功能包络样板候选运行 create-envelope。
权威来源:
- id: SRC-001
  文件: docs/spec/2026-08-04-DCF-当前实施规范.md
  章节:
  - '# 2 当前总体架构：六个世界，不相互冒充'
  - '# 3.2 认知只能追加变化，不能静默覆写历史'
  提取事实:
  - 锚定认知世界使用 SQLite 保存认知对象、不可变修订、锚点与关系。
  - 认知变化只能追加，不能静默覆写过去认知。
- id: SRC-002
  文件: docs/spec/2026-08-06-DCF-锚定认知世界与查询求解公共能力规范.md
  章节:
  - '# 2 锚定认知世界'
  - '# 3 正式认知对象与不可变修订'
  - '# 4 稳定文本锚点'
  提取事实:
  - SQLite 是认知对象与关系的权威持久层。
  - 认知对象采用稳定对象 + 不可变修订模型。
  - 逻辑对象字段包括 object_id、kind、current_revision_id、生命周期元数据。
  - 逻辑修订字段包括 revision_id、object_id、content、created_at、author_kind、source_refs、content_hash。
  - 产生新版本时创建新 revision_id，旧修订仍然存在。
  - 稳定锚点基于 revision_id + start_offset + end_offset + 校验哈希；锚点属于后续锚点能力，不是本候选包络必须公开的接口。
- id: SRC-003
  文件: docs/spec/2026-08-06-DCF-个人叙事功能块实施规范.md
  章节:
  - '# 15 正式个人叙事的持久化模型'
  - '# 18 保存事务与原子性'
  - '# 19 稳定锚点从正式修订产生'
  - '# 26 行为验收'
  提取事实:
  - 个人叙事作为正式认知对象进入 SQLite。
  - 用户后续修改必须创建新 revision，并更新 object.current_revision_id；禁止原地覆盖旧正文。
  - 正式保存必须使用单数据库事务，任一步失败必须 ROLLBACK。
  - 不得出现 revision 已写入但 current_revision 仍指旧版本的半状态。
  - 旧 revision 必须仍可读、可锚定。
  - 检索投影失败不得阻塞正式 revision 保存。
- id: SRC-004
  文件: docs/spec/2026-08-06-DCF-功能包络与施工控制规范.md
  章节:
  - '# 2 功能包络在暴露给执行层之前必须已经设计完成'
  - '# 3 输入 / 输出必须成为机器契约'
  - '# 4 能力 DAG'
  - '# 6 最小功能通路验证属于下游功能本身'
  - '# 7 通路验证默认不依赖真实上游实现完成'
  - '# 11 正式施工资格'
  - '# 16 当前功能包络元格式状态'
  提取事实:
  - 正式包络必须冻结输入、输出、错误、状态变化、质量/性能、依赖、通路验证和完整验收。
  - 未决定的公开契约不得留给执行层。
  - 当前样板正是“稳定认知对象 + 不可变修订”。
  - 合法 Fixture 的最小通路应尽早验证，但通路 PASS 不等于功能 PASSED。
- id: SRC-005
  文件: docs/current-state.md
  章节:
  - '# 14 当前施工入口'
  - '# 17 当前仍然开放的真实实施问题'
  提取事实:
  - 当前第一个功能包络样板候选是“稳定认知对象 + 不可变修订”。
  - 正式能力 DAG 与节点契约尚待设计层完成。
  - SQLite 最终表名与局部字段仍是开放实施问题。
  - 文本 span 的最终坐标编码仍是开放问题；该项属于后续锚点能力，本候选包络不把它作为阻塞项。
来源冲突或层级说明:
- 主题: author_kind
  说明: 公共锚定认知规范示意 AI / user / system / import；个人叙事局部规范对正式个人叙事使用 user_confirmed / imported_confirmed。对通用 cognition-01 来说，完整允许值集合尚未由设计层冻结，因此不能由 create-envelope 合并猜测。
- 主题: span 坐标
  说明: 公共锚定规范给出“规范化 UTF-8 正文字节位置”为当前首选实现语义，而 current-state 仍列为最终坐标开放项。本候选只覆盖对象与修订，不公开 span 接口，因此此冲突不阻塞本次包络。

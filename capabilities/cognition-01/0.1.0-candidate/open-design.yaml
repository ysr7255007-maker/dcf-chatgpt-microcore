状态: DESIGN_NOT_CLOSED
阻塞项:
- id: OPEN-001
  主题: 正式能力 DAG 注册缺失
  为什么阻塞: 施工控制规范要求正式功能包络组成能力 DAG；当前仓库未找到 capability-dag.yaml，current-state 也明确表示正式能力 DAG 尚待设计层完成。
  需要设计层决定: cognition-01 的正式节点编号、版本、上游能力依赖与向下游暴露的具体能力输出。
  执行层权限: 禁止自行创建正式依赖边。
- id: OPEN-002
  主题: 公开动作集合与调用边界未冻结
  为什么阻塞: 现行规范描述了对象/修订逻辑模型与事务行为，但没有定义调用者通过哪些公开动作创建、追加、读取对象或读取修订，也没有定义请求/响应传输边界。
  需要设计层决定: 公开动作名称、每个动作的输入/输出 Schema，以及验收适配入口是否属于公开契约或仅测试契约。
  执行层权限: 禁止根据实现便利自行决定 API。
- id: OPEN-003
  主题: object_id / revision_id 的产生者与格式未冻结
  为什么阻塞: 规范只声明二者是稳定/不可变身份，没有说明由调用者提供还是能力生成，也没有冻结 UUID、ULID 或其他格式。
  需要设计层决定: ID 产生责任、格式、唯一性范围和重复请求时的语义。
  执行层权限: 禁止自行选择 UUID 等格式并把它升级成公开契约。
- id: OPEN-004
  主题: kind 的公开值域未冻结
  为什么阻塞: 公共规范只示意 personal_narrative / document / ...，省略号表示开放集合；没有冻结完整枚举或扩展规则。
  需要设计层决定: kind 是封闭枚举、命名空间字符串还是版本化注册项，以及非法 kind 的错误语义。
- id: OPEN-005
  主题: created_at 的产生责任与时间格式未冻结
  为什么阻塞: 规范要求保存 created_at，但未明确由调用者提供还是提交时生成，也未冻结精度、时区和序列化格式。
  需要设计层决定: 时间产生责任、格式、精度和排序语义。
- id: OPEN-006
  主题: author_kind 的通用值域未冻结
  为什么阻塞: 公共认知规范与个人叙事局部规范使用不同示意值；通用 cognition-01 不能自行把二者合并。
  需要设计层决定: 通用 author_kind 的完整值域、局部功能如何扩展或映射。
- id: OPEN-007
  主题: source_refs 的机器结构未冻结
  为什么阻塞: 规范要求保存来源引用，但没有给出来源引用字段、身份格式、可空性、数量和引用不变量。
  需要设计层决定: source_refs 的 JSON Schema 或等价机器契约。
- id: OPEN-008
  主题: content_hash 算法与正文规范化规则未冻结
  为什么阻塞: 规范要求保存 content_hash，但没有规定算法、输入字节、Unicode/换行规范化规则；不同实现会产生不同正式输出。
  需要设计层决定: 哈希算法与精确输入字节规则。
- id: OPEN-009
  主题: 公开错误契约未冻结
  为什么阻塞: 施工控制规范要求错误格式与错误语义明确；认知规范尚未定义对象不存在、类型冲突、非法输入、持久化失败等公开错误码。
  需要设计层决定: 错误 Schema、错误码、可重试性与状态变化语义。
- id: OPEN-010
  主题: 重试 / 幂等 / 重复提交语义未冻结
  为什么阻塞: 事务原子性已明确，但同一个逻辑请求在进程中断或调用方重试后是否生成第二个 revision 尚未定义。
  需要设计层决定: 请求幂等键、重复请求识别或明确允许重复 revision 的规则。
- id: OPEN-011
  主题: 质量 / 性能门槛未被显式裁决
  为什么阻塞: 施工控制规范要求包络冻结质量/性能要求。现行来源既没有数值门槛，也没有明确裁决“本版本无性能门槛”。
  需要设计层决定: 给出可测性能门槛，或明确声明本版本仅以正确性为 PASS 门槛并把性能作为观察指标。
- id: OPEN-012
  主题: 对象生命周期元数据的包络边界未冻结
  为什么阻塞: 公共模型把生命周期元数据列入认知对象，但没有定义哪些字段属于 cognition-01 的正式输出，哪些应由更上层功能拥有。
  需要设计层决定: 本能力是否只拥有 object_id/kind/current_revision_id，还是还必须拥有状态、时间范围等生命周期字段。
非阻塞开放项:
- 主题: SQLite 物理表名与局部索引
  理由: current-state 明确仍开放；只要不暴露给下游，它属于内部实现，执行层可在不改变包络契约的前提下选择。
- 主题: span 最终坐标编码
  理由: cognition-01 候选只负责稳定对象与不可变修订；revision/span 稳定锚点应成为后续独立能力契约，因此不阻塞本候选边界闭合。
- 主题: FTS / embedding / 后期交互
  理由: 全部是可重算投影，规范明确不得阻塞正式认知保存。
